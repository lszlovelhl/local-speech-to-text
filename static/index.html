<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>语音识别</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="bg-glow"></div>

    <main class="app">
        <header class="header">
            <h1 class="title">语音识别</h1>
            <p class="subtitle">本地离线 · 中英文自动识别 · 支持视频音轨提取</p>
        </header>

        <section class="card">
            <div class="row">
                <span class="label">识别语言</span>
                <div class="segmented" id="langGroup">
                    <div class="seg-thumb"></div>
                    <button class="seg active" data-lang="auto">自动</button>
                    <button class="seg" data-lang="zh">中文</button>
                    <button class="seg" data-lang="en">English</button>
                </div>
            </div>
            <div class="row">
                <span class="label">模式</span>
                <div class="segmented" id="modeGroup">
                    <div class="seg-thumb"></div>
                    <button class="seg active" data-mode="single">单次识别</button>
                    <button class="seg" data-mode="conference">会议模式</button>
                </div>
            </div>
        </section>

        <section class="card recorder-card" id="dropZone">
            <div class="waveform" id="waveform">
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
            </div>

            <div class="mic-visual" id="micVisual">
                <div class="mic-ring"></div>
                <div class="mic-dot"></div>
            </div>

            <div class="record-btn-row">
                <button id="btnRecord" class="record-btn idle">
                    <span class="record-icon"></span>
                    <span id="btnRecordText">开始录音</span>
                </button>
            </div>

            <div class="status-row">
                <span id="statusBadge" class="badge idle">待机</span>
                <span id="timerText" class="timer">00:00</span>
            </div>

            <p id="hintText" class="hint">按空格键开始/停止录音 · 拖拽文件到此处上传</p>
        </section>

        <section class="card">
            <div class="upload-row">
                <input type="file" id="fileInput" accept=".wav,.webm,.ogg,.mp3,.m4a,.flac,.mp4,.mov,.mkv,.avi,.m4v" hidden>
                <button id="btnUpload" class="upload-btn">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M10 13V3M10 3L6 7M10 3L14 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M3 13V16.5A1.5 1.5 0 004.5 18h11a1.5 1.5 0 001.5-1.5V13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    上传音频/视频文件
                </button>
                <span id="fileName" class="file-name"></span>
            </div>
        </section>

        <section class="card result-card">
            <div class="result-meta">
                <span>语言 <strong id="metaLang">auto</strong></span>
                <span>时长 <strong id="metaDuration">--</strong>s</span>
                <span>耗时 <strong id="metaProcessing">--</strong>s</span>
            </div>
            <div id="resultText" class="result-text placeholder">识别文字将显示在这里…</div>
            <div id="segmentList" class="segment-list hidden"></div>
            <div class="result-actions">
                <button id="btnCopy" class="ghost-btn" disabled>复制</button>
                <button id="btnExport" class="ghost-btn" disabled>导出 TXT</button>
                <button id="btnClear" class="ghost-btn">清空</button>
            </div>
        </section>

        <section class="card">
            <div class="result-meta" style="margin-bottom:8px">
                <span style="font-weight:600;font-size:15px">历史记录</span>
                <span style="color:var(--text-secondary);font-size:12px">仅保留当天 · 超过24h自动清除</span>
            </div>
            <div id="historyList" class="history-list">
                <div class="history-empty">暂无记录</div>
            </div>
        </section>
    </main>

    <div id="toast" class="toast"></div>
    <script src="/static/app.js"></script>
</body>
</html>
